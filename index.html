      el("div", { class: "fbox-h" }, [el("strong", { text: (f.label || "Dòng chữ") + (f.editable ? " · người dùng gõ" : " · cố định") }),
        el("div", { class: "nav" }, [
          el("button", { class: "icon", text: "↑", "aria-label": "Đưa dòng lên", disabled: idx === 0, onclick: function () { t.fields.splice(idx, 1); t.fields.splice(idx - 1, 0, f); dirty(); } }),
          el("button", { class: "icon", text: "↓", "aria-label": "Đưa dòng xuống", disabled: idx === t.fields.length - 1, onclick: function () { t.fields.splice(idx, 1); t.fields.splice(idx + 1, 0, f); dirty(); } }),
          el("button", { class: "icon", text: "✕", "aria-label": "Xoá dòng chữ", onclick: function () { t.fields.splice(idx, 1); dirty(); } })
        ])]),
      el("div", { class: "fgrid" }, [
        txt("label", "Tên ô (hiện cho người dùng)"),
        txt("text", f.editable ? "Chữ mặc định khi để trống" : "Nội dung chữ"),
        el("label", { class: "f", for: fontSel.id }, [document.createTextNode("Kiểu chữ"), fontSel]),
        el("label", { class: "f", for: col.id }, [document.createTextNode("Màu chữ"), col]),
        el("div", { class: "f" }, [el("label", { class: "chk", for: strokeOn.id }, [strokeOn, document.createTextNode("Viền chữ")]), scol]),
        el("div", { class: "f" }, [el("label", { class: "chk", for: ed.id }, [ed, document.createTextNode("Cho phép gõ")]), el("label", { class: "chk", for: up.id }, [up, document.createTextNode("Tự viết HOA")])])
      ]),
      el("div", { class: "fgrid" }, [
        rng("y", "Vị trí dọc", 0.05, 0.95, 0.005),
        rng("x", "Vị trí ngang", 0.1, 0.9, 0.005),

        rng("maxW", "Chiều rộng tối đa", 0.2, 0.95, 0.01)
      ])
    ]);
  }
  async function imageToDataUrl(file, W, H, mode, type) {
    var url = URL.createObjectURL(file);
    try {
      var img = await new Promise(function (res, rej) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = rej; i.src = url; });
      var c = document.createElement("canvas"), ctx = c.getContext("2d");
      if (mode === "cover") {
        c.width = W; c.height = H; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
        var s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
        ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      } else {
        var s2 = Math.min(1, W / img.width, H / img.height);
        c.width = Math.max(1, Math.round(img.width * s2)); c.height = Math.max(1, Math.round(img.height * s2));
        ctx.drawImage(img, 0, 0, c.width, c.height);
      }
      return c.toDataURL(type, 0.9);
    } finally { URL.revokeObjectURL(url); }
  }

  var saveStatusEl;
  function setSaveStatus(m, k) { if (saveStatusEl) { saveStatusEl.textContent = m; saveStatusEl.className = "status" + (k ? " " + k : ""); } }
  function saveBar() {
    saveStatusEl = el("div", { class: "status" + (adm.dirty ? " warn" : ""), role: "status", text: adm.dirty ? "Có thay đổi chưa lưu." : "Chưa có thay đổi." });
    var btn = el("button", { class: "primary", text: "Lưu & cập nhật cho mọi người", onclick: async function () {
      btn.disabled = true; setSaveStatus("Đang lưu…");
      try {
        var data = { version: 1, templates: adm.list };
        await ghSaveTemplates(data);
        DATA = clone(data);
        adm.dirty = false;
        setSaveStatus("Đã lưu lên GitHub. Khoảng 1–2 phút nữa mọi người tải lại trang (F5) sẽ thấy mẫu mới.", "ok");
      } catch (e) {
        setSaveStatus((e && e.message) || "Chưa lưu được. Thử lại sau ít phút.", "err");
      }
      btn.disabled = false;
    } });
    var undo = el("button", { class: "ghost", text: "Bỏ thay đổi", disabled: !adm.dirty, onclick: function () { adm = null; rerenderAdmin(); } });
    return el("div", { class: "save-bar" }, [saveStatusEl, undo, btn]);
  }

  // ---------- start popup: even or odd ----------
  function showStartModal() {
    if (route() === "admin" || document.getElementById("start-modal")) return;
    var prevFocus = document.activeElement;
    function close() { bg.remove(); document.removeEventListener("keydown", onKey); if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) {} }
    function choose(mode) {
      state.mode = mode;
      if (mode === "even" && expandedBanners().length % 2 === 1) {
        var t = tplById(state.sel); state.banners.push({ id: uid(), tpl: t.id, vals: {}, copies: 1 });
      }
      close(); changed(true);
      if (mode === "even") setTimeout(function () { var ins = mainRefs.rows && mainRefs.rows.querySelectorAll("input.name-in"); if (ins) { for (var i = 0; i < ins.length; i++) { if (!ins[i].value) { ins[i].focus(); return; } } } }, 50);
    }
    function onKey(e) { if (e.key === "Escape") close(); if (e.key === "Tab") { var f = bg.querySelectorAll("button"); var a = f[0], z = f[f.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } } }
    var evenBtn = el("button", { class: "primary", onclick: function () { choose("even"); } }, [document.createTextNode("Số chẵn"), el("small", { text: "2, 4, 6… khách" })]);
    var bg = el("div", { class: "modal-bg", id: "start-modal" }, [
      el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "start-q" }, [
        el("h2", { id: "start-q", text: "Anh/chị in số lượng chẵn hay lẻ?" }),
        el("div", { class: "choices" }, [
          evenBtn,
          el("button", { onclick: function () { choose("odd"); } }, [document.createTextNode("Số lẻ"), el("small", { text: "1, 3, 5… khách" })])
        ]),
        el("p", { class: "note" }, [el("strong", { text: "Lưu ý: " }), document.createTextNode("Khuyến khích anh/chị in số lượng chẵn để tiết kiệm giấy! Mỗi tờ A3 in được 2 bảng, in số lẻ thì nửa tờ cuối sẽ bỏ trống.")])
      ])
    ]);
    document.body.appendChild(bg);
    document.addEventListener("keydown", onKey);
    setTimeout(function () { evenBtn.focus(); }, 30);
  }

  // ---------- boot ----------
  function renderLoading() {
    app.innerHTML = "";
    headerEl = el("header", { class: "top" }); app.appendChild(headerEl); renderHeader();
    app.appendChild(el("div", { class: "step" }, [el("p", { class: loadState === "error" ? "status err" : "hint", text: loadState === "error"
      ? "Không tải được danh sách mẫu. Kiểm tra mạng rồi tải lại trang (F5)."
      : "Đang tải mẫu…" })]));
  }
  renderLoading();
  fetch("templates.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (d) {
    DATA = (d && Array.isArray(d.templates)) ? d : { version: 1, templates: [] };
    loadState = "ok";
    state = freshState();
    renderAll();
    showStartModal();
  }).catch(function () { loadState = "error"; renderLoading(); });
  var sample = "ÀÁẢÃẠĂẮẰẲẴẶÂẤẦẨẪẬĐÉÈẺẼẸÊẾỀỂỄỆÍÌỊÓÒỎÕỌÔỐỒỔỖỘƠỚỜỞỠỢÚÙỦŨỤƯỨỪỬỮỰÝỲỶỸỴ chúc mừng nhận xe mới";
  if (document.fonts && document.fonts.load) {
    Promise.all([fontStr("bold", 40), fontStr("thin", 40), fontStr("semi", 40), fontStr("script", 40), fontStr("sans", 40)].map(function (f) { return document.fonts.load(f, sample).catch(function () {}); }))
      .then(function () { return document.fonts.ready; })
      .then(function () { if (loadState === "ok") renderAll(); });
  }
})();
